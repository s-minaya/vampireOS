<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=390, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0506" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0506'/%3E%3Crect x='4.5' y='4.5' width='7' height='7' transform='rotate(45 8 8)' fill='%23c8102e'/%3E%3C/svg%3E" />
    <title>VampireOS</title>
    <style>
      /* Initial loader: shown only if the critical assets take a moment. Replaced by the first screen. */
      body { margin: 0; background: #0a0506; }
      .vos-loader { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #0a0506; color: #a8998a; font: 13px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.2em; opacity: 0; animation: vos-loader-in 0.01s 0.35s forwards; }
      .vos-loader-bar { width: 150px; height: 10px; padding: 3px; border: 2px solid #eadfcf; }
      .vos-loader-bar div { width: 0; height: 100%; background: #c8102e; transition: width 0.15s steps(3, end); }
      @keyframes vos-loader-in { to { opacity: 1; } }
    </style>
  </head>
  <body data-theme="dark">
    <div id="stage" class="stage">
      <div class="vos-loader" role="status" aria-label="Loading VampireOS">
        <div>SUMMONING VAMPIREOS</div>
        <div class="vos-loader-bar"><div data-loader-fill></div></div>
      </div>
    </div>
    <div class="crt crt--scan" aria-hidden="true"></div>
    <div class="crt crt--vignette" aria-hidden="true"></div>
    <noscript>VampireOS requires JavaScript. Sofi insists this is a feature.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
